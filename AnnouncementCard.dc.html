<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:white; border:1px solid oklch(92% 0.02 200); border-radius:16px; padding:18px 20px; display:flex; flex-direction:column; gap:8px; height:100%;">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
    <span style="{{ post.tagStyle }}">【{{ post.tag }}】</span>
    <span style="font-size:12px; color:oklch(55% 0.02 200);">{{ post.date }}</span>
  </div>
  <span style="font-weight:700; font-size:15px; color:oklch(28% 0.03 200); line-height:1.5;">{{ post.title }}</span>
  <span style="font-size:13px; color:oklch(48% 0.02 200); line-height:1.6;">{{ post.summary }}</span>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 320, &quot;height&quot;: 160}}"></script>
</body>
</html>
